<!DOCTYPE html>
<html>

<head>
    <title>Simple Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Registration Form</h2>

    <form id="myForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
        ><br><br>

        <input
            type="email"
            id="email"
            placeholder="Email"
        ><br><br>

        <input
            type="password"
            id="password"
            placeholder="Password"
        ><br><br>

        <button type="submit">
            Register
        </button>

        <p id="error" style="color:red;"></p>

    </form>

    <script src="script.js"></script>

</body>

</html>
